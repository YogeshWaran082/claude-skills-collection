<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Lab 2.0 — Claude Skills Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>

  <div class="shell">
    <!-- Far-left floating icon rail (Reference Images 1, 2, 4) -->
    <aside class="icon-rail" aria-label="Primary rail">
      <div class="rail-top">
        <button class="rail-brand" id="railBrandBtn" title="Skill Lab 2.0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" />
          </svg>
        </button>

        <div class="rail-divider"></div>

        <button class="rail-btn active" data-view="dashboard" title="Dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1v-9.5z" />
          </svg>
        </button>
        <button class="rail-btn" data-view="all" title="All Skills">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
        </button>
        <button class="rail-btn" data-view="install" title="Terminal & Chat Setup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polyline points="4 17 10 11 4 5" />
            <line x1="12" y1="19" x2="20" y2="19" />
          </svg>
        </button>
        <button class="rail-btn" data-view="community" title="Community Repositories">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
          </svg>
        </button>
      </div>

      <div class="rail-bottom">
        <span class="rail-label">SKILL LAB 2.0</span>
        <button class="rail-btn" id="themeToggleRail" title="Toggle Light / Dark Frosted Glass">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" />
          </svg>
        </button>
      </div>
    </aside>

    <!-- Main macOS-style frosted window -->
    <div class="app-window">
      <!-- Structured Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="window-chrome">
          <div class="traffic-lights" aria-hidden="true">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
          </div>
          <button class="sidebar-collapse-btn" id="sidebarToggleBtn" title="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <line x1="9" y1="4" x2="9" y2="20" />
            </svg>
          </button>
        </div>

        <div class="brand-card">
          <div class="brand-avatar">SL</div>
          <div class="brand-meta">
            <div class="brand-name">Skill Lab 2.0</div>
            <div class="brand-sub">YogeshWaran082 / collection</div>
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-title">Workspace</div>
          <button class="nav-item active" data-view="dashboard">
            <span class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="3" width="8" height="8" rx="2" />
                <rect x="13" y="3" width="8" height="5" rx="2" />
                <rect x="13" y="10" width="8" height="11" rx="2" />
                <rect x="3" y="13" width="8" height="8" rx="2" />
              </svg>
              <span>Dashboard</span>
            </span>
            <span class="pill-count" id="countTotalSide">90</span>
          </button>
          <button class="nav-item" data-view="all">
            <span class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
              </svg>
              <span>All Skills</span>
            </span>
            <span class="pill-count" id="countAllSide">90</span>
          </button>
          <button class="nav-item" data-view="install">
            <span class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <polyline points="4 17 10 11 4 5" />
                <line x1="12" y1="19" x2="20" y2="19" />
              </svg>
              <span>Install &amp; CLI</span>
            </span>
            <span class="kbd-chip">SH</span>
          </button>
          <button class="nav-item" data-view="community">
            <span class="nav-left">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="9" />
                <path d="M3.6 9h16.8M3.6 15h16.8" />
                <path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
              </svg>
              <span>Community Repos</span>
            </span>
            <span class="pill-count">4</span>
          </button>
        </div>

        <div class="nav-section folders-section">
          <div class="nav-title-row">
            <span class="nav-title">Skill Folders</span>
            <span class="folder-badge-total" id="countFoldersSide">13</span>
          </div>
          <div class="sidebar-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="folderFilterInput" placeholder="Filter folders..." />
          </div>
          <div class="folder-tree" id="folderTree"></div>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main class="workspace">
        <header class="topbar">
          <div class="topbar-left">
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
              </svg>
            </button>
            <div class="breadcrumb" id="breadcrumb">
              <span class="crumb-root">Skill Lab 2.0</span>
              <span class="crumb-sep">›</span>
              <span class="crumb-current">Dashboard</span>
            </div>
          </div>

          <div class="topbar-actions">
            <div class="global-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="11" cy="11" r="7" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input type="text" id="globalSearchInput" placeholder="Search 90 skills, tags, or use cases..." />
              <kbd class="kbd-shortcut">⌘K</kbd>
            </div>
            <button class="theme-pill" id="themeToggleTop" title="Switch Light / Dark Frosted Glass">
              <span class="theme-dot"></span>
              <span id="themeLabel">Light Glass</span>
            </button>
            <a class="repo-btn" href="https://github.com/YogeshWaran082/claude-skills-collection" target="_blank" rel="noopener">
              GitHub ↗
            </a>
          </div>
        </header>

        <div class="workspace-scroll" id="workspaceContent">
          <!-- Rendered dynamically by app.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Skill Inspector Drawer / Modal -->
  <div class="modal-backdrop" id="skillModalBackdrop" aria-hidden="true">
    <div class="skill-modal" role="dialog" aria-modal="true" aria-labelledby="modalSkillTitle">
      <div class="modal-header">
        <div>
          <div class="modal-category" id="modalSkillCategory">designing</div>
          <h2 class="modal-title" id="modalSkillTitle">skill-name</h2>
          <p class="modal-desc" id="modalSkillDesc"></p>
        </div>
        <button class="modal-close" id="modalCloseBtn" aria-label="Close">✕</button>
      </div>

      <div class="modal-toolbar">
        <button class="action-btn primary" id="copyRawBtn">Copy Full SKILL.md</button>
        <button class="action-btn" id="copyCliBtn">Copy Claude CLI Install</button>
        <a class="action-btn" id="openGithubLink" href="#" target="_blank" rel="noopener">View on GitHub ↗</a>
        <span class="modal-meta" id="modalSkillMeta"></span>
      </div>

      <div class="modal-body">
        <pre class="skill-code" id="modalSkillContent"></pre>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
